services:
  serena-mcp:
    image: mekayelanik/serena-mcp:latest
    container_name: serena-mcp
    restart: unless-stopped
    ports:
      - "9121:9121"
    volumes:
      - /path/to/your/project:/data:rw
      - serena-config:/config
      - serena-cache:/home/serena/.cache
    environment:
      # Transport
      - PORT=9121
      - INTERNAL_PORT=38011
      - PROTOCOL=SHTTP
      - ENABLE_HTTPS=false
      - HTTP_VERSION_MODE=auto
      # Serena core
      - SERENA_PROJECT=/data
      - SERENA_CONTEXT=desktop-app
      - SERENA_TRANSPORT=stdio
      - SERENA_PORT=9121
      - SERENA_MODES=
      - SERENA_LOG_LEVEL=INFO
      # mcp-proxy session model. Stateful by default — one stdio child per
      # Mcp-Session-Id, reused across requests. Sessions persist until the
      # client explicitly closes them (no server-side TTL). Set to true only
      # if full per-request isolation is required (memory-hostile).
      - MCP_PROXY_STATELESS=false
      # Cap virtual memory of each Serena stdio child (MiB; 0 disables)
      - SERENA_MAX_MEM_MB=4096
      # HAProxy concurrency caps (0 disables)
      - HAPROXY_FRONTEND_MAXCONN=64
      - HAPROXY_SERVER_MAXCONN=16
      # System
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      # Optional: require Bearer token auth at HAProxy layer
      # - API_KEY=replace-with-strong-secret
      # Optional: CORS origins
      # - CORS=*

volumes:
  serena-config:
    driver: local
  serena-cache:
    driver: local
